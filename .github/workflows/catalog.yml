name: Обновление каталога

on:
  push:
    paths: ["arts.txt", "sync_catalog.py"]
  schedule:
    - cron: "30 4 * * *"      # ночью тянем свежие остатки из Google-таблицы
  workflow_dispatch:

concurrency: dealers-catalog

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python sync_catalog.py
      - name: Закоммитить каталог
        run: |
          git config user.name "almaly-bot"
          git config user.email "actions@github.com"
          git add docs/data.json
          git diff --cached --quiet && exit 0
          git commit -m "Обновление остатков [skip ci]"
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push && exit 0
            sleep 5
          done
          exit 1
