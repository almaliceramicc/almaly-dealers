name: Зеркало витрины

# Портал → витрина QR. Обратного пути нет: этот workflow только читает портал
# и пушит в almaly-tiles чужим токеном (секрет TILES_TOKEN).
# Ночное «Обновление каталога» коммитит с [skip ci] и своим GITHUB_TOKEN,
# поэтому остатки зеркало не запускают и цикла между репозиториями нет.
on:
  push:
    branches: [main]
    paths:
      - "docs/img/**"
      - "docs/data.json"
      - "arts.txt"
      - "mirror_catalog.py"
      - ".github/workflows/mirror.yml"
  workflow_dispatch:

concurrency:
  group: mirror-catalog
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Проверить секрет
        env:
          TOKEN: ${{ secrets.TILES_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::В almaly-dealers нет секрета TILES_TOKEN. Портал сохранён, витрина не обновлена. Шаги — в README, раздел «Зеркало витрины»."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/checkout@v4
        with:
          repository: almaliceramicc/almaly-tiles
          token: ${{ secrets.TILES_TOKEN }}
          path: tiles-mirror
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Перенести фото и состав каталога
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python mirror_catalog.py --tiles tiles-mirror --arts-only
          else
            BEFORE="${{ github.event.before }}"
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              python mirror_catalog.py --tiles tiles-mirror --arts-only
            else
              python mirror_catalog.py --tiles tiles-mirror --since "$BEFORE"
            fi
          fi

      - name: Опубликовать на витрине
        working-directory: tiles-mirror
        run: |
          git config user.name "almaly-bot"
          git config user.email "actions@github.com"
          git add -A -- arts.txt photos
          if git diff --cached --quiet; then
            echo "Витрина уже совпадает с порталом."
            exit 0
          fi
          git commit -m "Зеркало с дилерского портала"
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push && exit 0
            sleep 5
          done
          exit 1
